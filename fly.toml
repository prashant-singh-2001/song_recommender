# fly.toml app configuration file generated for song-recommender on 2026-10-27T13:37:46Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'song-recommender'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'
  build-target = 'backend'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
