# Fly.io config for the backend API (the frontend is served by Vercel).
# Fly app names are global: change `app` to something unique, or run
#   fly launch --no-deploy --copy-config --name <your-name>
app = "lyriclink-api"
primary_region = "bom" # Mumbai; pick the region closest to your users

[build]
  dockerfile = "Dockerfile"
  build-target = "backend" # the root Dockerfile also has frontend stages

# Browser origins allowed to call the API are set as a secret, not in this file:
#   fly secrets set CORS_ORIGINS="https://<your-app>.vercel.app"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"   # stops when idle to save cost; first request after is slower
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  # The index, lyrics and Python libraries need a few hundred MB; 256 MB is too small.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
